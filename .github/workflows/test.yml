name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme:
    name: Theme validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate theme JSON and color references
        run: python tests/test_theme.py
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path(".").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print(f"ok: {p}")
          PY

  shell:
    name: Shell installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run install/uninstall tests
        shell: bash
        run: bash tests/test-install.sh

  powershell:
    name: PowerShell installer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install/uninstall tests
        shell: pwsh
        run: ./tests/test-install.ps1
