name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Theme validation (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate theme files
        run: python tests/test_theme.py
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path(".").rglob("*.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print(f"ok: {p}")
          PY
      - name: Bash syntax
        run: bash -n install.sh uninstall.sh tests/test-install.sh

  shell:
    name: Shell installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install/uninstall tests
        shell: bash
        run: bash tests/test-install.sh

  powershell:
    name: PowerShell installer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem install.ps1, uninstall.ps1, tests/test-install.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "FAIL $($_.Name): $($errors[0].Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Run install/uninstall tests
        shell: pwsh
        run: ./tests/test-install.ps1
